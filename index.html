<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lampenschirm Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110e;
    --panel: #1c1813;
    --panel-2: #241f19;
    --line: #342d24;
    --text: #efe6d6;
    --muted: #a39580;
    --accent: #f0a54a;
    --accent-ink: #1b1207;
    --warn: #e8795a;
    --ok: #9cc58a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }

  /* ---------- Sidebar ---------- */
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
    display: flex; flex-direction: column; }
  .brand { padding: 22px 22px 14px; border-bottom: 1px solid var(--line); }
  .brand h1 { font-family: "Fraunces", serif; font-weight: 600; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

  .presets { padding: 14px 22px 16px; border-bottom: 1px solid var(--line); }
  .label-sm { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 6px 11px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.ghost { background: transparent; color: var(--muted); }

  details { border-bottom: 1px solid var(--line); }
  summary { list-style: none; cursor: pointer; padding: 14px 22px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 18px; }
  details[open] summary::after { content: "–"; }
  .group-body { padding: 0 22px 16px; display: grid; gap: 14px; }

  .ctrl { display: grid; gap: 6px; }
  .ctrl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ctrl-head label { color: var(--text); }
  .num { display: flex; align-items: baseline; gap: 3px; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); }
  .num input { width: 58px; background: transparent; border: 1px solid transparent; color: var(--text);
    font: inherit; text-align: right; padding: 1px 4px; border-radius: 4px; }
  .num input:hover, .num input:focus { border-color: var(--line); outline: none; background: var(--panel-2); }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px;
    background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--line) var(--fill, 50%)); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--text); border: 3px solid var(--panel); margin-top: -6px; box-shadow: 0 0 0 1px var(--accent); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text);
    border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  select { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font: inherit; }
  .check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; }
  input[type=color] { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); padding: 3px; cursor: pointer; }
  .ctrl.disabled { opacity: .4; pointer-events: none; }

  .side-foot { margin-top: auto; padding: 16px 22px 22px; display: grid; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: inherit;
    padding: 10px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ---------- Viewport ---------- */
  main { position: relative; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; }
  .toolbar { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; }
  .toolbar .btn { backdrop-filter: blur(8px); background: rgba(28,24,19,.78); }
  .toolbar .btn.primary { background: var(--accent); }
  .stats { position: absolute; left: 16px; bottom: 16px; background: rgba(28,24,19,.82); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 250px; max-width: 360px; }
  .stats dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-family: "IBM Plex Mono", monospace; text-align: right; }
  .warnings { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 12.5px; }
  .warnings li { color: var(--warn); line-height: 1.4; }
  .warnings li.ok { color: var(--ok); }
  .hint { position: absolute; right: 16px; bottom: 16px; color: var(--muted); font-size: 12px; }
  .toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .busy { position: absolute; top: 22px; left: 16px; font-size: 12px; color: var(--muted); font-family: "IBM Plex Mono", monospace;
    opacity: 0; transition: opacity .15s; pointer-events: none; }
  .busy.show { opacity: 1; }
  [hidden] { display: none !important; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    main { order: -1; height: 55vh; }
    aside { border-right: 0; }
    .stats { min-width: 0; max-width: calc(100% - 32px); padding: 8px 10px; }
    .hint { display: none; }
    .toolbar { top: 10px; right: 10px; flex-wrap: wrap; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Lampenschirm <span>Studio</span></h1>
      <p>Parametrischer Geflecht-Lampenschirm. Werte anpassen, ansehen und als STL für den 3D-Druck exportieren.</p>
    </div>
    <div class="presets">
      <div class="label-sm">Vorlagen</div>
      <div class="chips" id="presets"></div>
    </div>
    <div id="controls"></div>
    <div class="side-foot">
      <div class="row2">
        <button class="btn" id="btnRandom">Zufall</button>
        <button class="btn" id="btnReset">Zurücksetzen</button>
      </div>
      <div class="row2">
        <button class="btn" id="btnSave">Parameter speichern</button>
        <button class="btn" id="btnLoad">Parameter laden</button>
      </div>
      <button class="btn" id="btnLink">Link kopieren</button>
      <input type="file" id="fileLoad" accept=".json,application/json" hidden>
    </div>
  </aside>

  <main>
    <div id="view"></div>
    <div class="toolbar">
      <button class="btn" id="btnLight">Licht an</button>
      <button class="btn" id="btnCam">Ansicht</button>
      <button class="btn" id="btnExplode" hidden>Zerlegt</button>
      <button class="btn primary" id="btnStl">STL Schirm</button>
      <button class="btn primary" id="btnStlBase" hidden>STL Sockel</button>
    </div>
    <div class="busy" id="busy">Berechne …</div>
    <div class="stats">
      <dl id="statsList"></dl>
      <ul class="warnings" id="warnings"></ul>
    </div>
    <div class="hint">Ziehen: drehen · Rechtsklick: verschieben · Mausrad: zoomen</div>
    <div class="toast" id="toast"></div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   Parameter
   ===================================================================== */
const SCHEMA = [
  { group: 'Form', open: true, items: [
    { k: 'hoehe', l: 'Höhe', min: 60, max: 400, step: 1, def: 180, u: 'mm' },
    { k: 'radiusUnten', l: 'Radius unten', min: 20, max: 200, step: 1, def: 90, u: 'mm' },
    { k: 'radiusOben', l: 'Radius oben', min: 20, max: 200, step: 1, def: 60, u: 'mm' },
    { k: 'bauch', l: 'Wölbung', min: -80, max: 80, step: 1, def: 20, u: 'mm' },
    { k: 'bauchPos', l: 'Wölbung Position', min: 0.1, max: 0.9, step: 0.01, def: 0.5, u: '' },
    { k: 'rillenForm', l: 'Rillen / Etagen', type: 'select', def: 'welle', opts: [
      ['welle', 'Wellen-Rillen'], ['kissen', 'Kissen-Etagen (gestapelt)']] },
    { k: 'rillenAmp', l: 'Tiefe', min: 0, max: 30, step: 0.5, def: 0, u: 'mm' },
    { k: 'rillenAnzahl', l: 'Anzahl', min: 1, max: 12, step: 1, def: 4, u: '' },
    { k: 'prallheit', l: 'Prallheit der Kissen', min: 0, max: 1, step: 0.01, def: 0.55, u: '' },
    { k: 'kanteUnten', l: 'Kante unten abrunden', min: 0, max: 30, step: 0.5, def: 0, u: 'mm' },
    { k: 'kanteOben', l: 'Kante oben abrunden', min: 0, max: 30, step: 0.5, def: 0, u: 'mm' },
  ]},
  { group: 'Querschnitt & Verdrehung', open: true, items: [
    { k: 'querschnitt', l: 'Querschnitt', type: 'select', def: '0', opts: [
      ['0', 'Rund'], ['3', 'Dreieck (abgerundet)'], ['4', 'Viereck (abgerundet)'], ['5', 'Fünfeck (abgerundet)'],
      ['6', 'Sechseck (abgerundet)'], ['8', 'Achteck (abgerundet)']] },
    { k: 'eckigkeit', l: 'Eckigkeit', min: 2.2, max: 16, step: 0.1, def: 5, u: '' },
    { k: 'seitenVerhaeltnis', l: 'Seitenverhältnis (Tiefe : Breite)', min: 0.5, max: 2, step: 0.01, def: 1, u: '' },
    { k: 'verdrehung', l: 'Verdrehung über die Höhe', min: -180, max: 180, step: 1, def: 0, u: '°' },
    { k: 'verdrehVerlauf', l: 'Verlauf der Verdrehung', type: 'select', def: 'linear', opts: [
      ['linear', 'Gleichmäßig'], ['s', 'S-Kurve (sanfter Anfang und Ende)'], ['welle', 'Hin und zurück'],
      ['lokal', 'Falte (auf eine Zone konzentriert)']] },
    { k: 'verdrehMitte', l: 'Falte: Höhe', min: 0.1, max: 0.9, step: 0.01, def: 0.4, u: '' },
    { k: 'verdrehBreite', l: 'Falte: Breite', min: 0.05, max: 0.6, step: 0.01, def: 0.2, u: '' },
  ]},
  { group: 'Geflecht', open: true, items: [
    { k: 'muster', l: 'Muster', type: 'select', def: 'geflecht', opts: [
      ['geflecht', 'Geflecht (gekreuzt)'], ['rechts', 'Spirale rechts'], ['links', 'Spirale links'], ['keine', 'Kein Geflecht']] },
    { k: 'straenge', l: 'Stränge je Richtung', min: 3, max: 220, step: 1, def: 16, u: '' },
    { k: 'drehung', l: 'Drehung', min: 0, max: 2.5, step: 0.01, def: 0.34, u: 'U' },
    { k: 'strangBreite', l: 'Strangbreite', min: 0.8, max: 10, step: 0.1, def: 2.4, u: 'mm' },
    { k: 'strangTiefe', l: 'Strangstärke', min: 0.6, max: 6, step: 0.1, def: 1.6, u: 'mm' },
    { k: 'webart', l: 'Webart', type: 'select', def: 'leinwand', opts: [
      ['leinwand', 'Leinwand (1 über, 1 unter)'], ['koeper22', 'Köper 2/2 (Diagonalrippen)'], ['koeper21', 'Köper 2/1']] },
    { k: 'webTiefe', l: 'Webversatz (über/unter)', min: 0, max: 3, step: 0.05, def: 0.5, u: 'mm' },
    { k: 'wellenAmp', l: 'Wellen Ausschlag', min: 0, max: 20, step: 0.5, def: 0, u: '°' },
    { k: 'wellenFreq', l: 'Wellen Anzahl', min: 1, max: 16, step: 1, def: 4, u: '' },
  ]},
  { group: 'Stabilität', items: [
    { k: 'rippen', l: 'Senkrechte Rippen', min: 0, max: 48, step: 1, def: 0, u: '' },
    { k: 'zwischenRinge', l: 'Zwischenringe', min: 0, max: 12, step: 1, def: 0, u: '' },
    { k: 'randHoehe', l: 'Randhöhe', min: 0, max: 20, step: 0.5, def: 5, u: 'mm' },
    { k: 'randDicke', l: 'Randstärke', min: 1, max: 10, step: 0.1, def: 2.8, u: 'mm' },
  ]},
  { group: 'Leuchtmittel & Fassung', items: [
    { k: 'fassung', l: 'Halter für Leuchtmittel', type: 'check', def: true },
    { k: 'fassungPos', l: 'Position', type: 'select', def: 'oben', opts: [
      ['oben', 'Speichen oben im Schirm (Pendelleuchte)'], ['unten', 'Speichen unten im Schirm'],
      ['boden', 'Boden fest im Schirm (ein Teil)'], ['sockel', 'Im Sockel (eigenes Teil, getrennt drucken)']] },
    { k: 'einsatz', l: 'Leuchtmittel', type: 'select', def: 'fassung', opts: [
      ['fassung', 'Lampenfassung (E27/E14/GU10)'], ['puck', 'LED-Puck (rund)'], ['panel', 'LED-Panel (rechteckig)']] },
    { k: 'bodenDicke', l: 'Bodenstärke', min: 1.2, max: 6, step: 0.1, def: 2.4, u: 'mm' },
    { k: 'kragen', l: 'Kragen um die Fassung', min: 0, max: 20, step: 0.5, def: 6, u: 'mm' },
    { k: 'nasen', l: 'Aussparungen im Fassungsloch', min: 0, max: 6, step: 1, def: 0, u: '' },
    { k: 'puckD', l: 'Puck-Durchmesser', min: 30, max: 180, step: 0.5, def: 70, u: 'mm' },
    { k: 'panelB', l: 'Panel-Breite', min: 20, max: 240, step: 0.5, def: 120, u: 'mm' },
    { k: 'panelL', l: 'Panel-Länge', min: 20, max: 240, step: 0.5, def: 160, u: 'mm' },
    { k: 'panelEcke', l: 'Panel-Eckenradius', min: 0, max: 30, step: 0.5, def: 3, u: 'mm' },
    { k: 'einsatzTiefe', l: 'Einlasstiefe (Dicke)', min: 0, max: 25, step: 0.5, def: 8, u: 'mm' },
    { k: 'falz', l: 'Auflagekante', min: 1, max: 12, step: 0.5, def: 3, u: 'mm' },
    { k: 'fassungTyp', l: 'Fassungstyp', type: 'select', def: 'e27', opts: [
      ['e27', 'E27 (Loch ca. 42 mm)'], ['e14', 'E14 (Loch ca. 29 mm)'], ['gu10', 'GU10 (Loch ca. 36 mm)'], ['frei', 'Eigenes Maß']] },
    { k: 'lochD', l: 'Lochdurchmesser', min: 15, max: 80, step: 0.5, def: 42, u: 'mm' },
    { k: 'fassRing', l: 'Ringbreite', min: 2, max: 20, step: 0.5, def: 6, u: 'mm' },
    { k: 'speichen', l: 'Speichen', min: 2, max: 12, step: 1, def: 4, u: '' },
    { k: 'speichenBreite', l: 'Speichenbreite', min: 2, max: 15, step: 0.5, def: 5, u: 'mm' },
    { k: 'speichenHoehe', l: 'Speichenhöhe', min: 1.5, max: 12, step: 0.5, def: 4, u: 'mm' },
  ]},
  { group: 'Sockel', items: [
    { k: 'sockel', l: 'Sockel unter dem Schirm', type: 'check', def: false },
    { k: 'sockelHoehe', l: 'Sockelhöhe', min: 20, max: 150, step: 1, def: 65, u: 'mm' },
    { k: 'sockelUeberstand', l: 'Überstand zum Schirm', min: 0, max: 20, step: 0.5, def: 3, u: 'mm' },
    { k: 'sockelWand', l: 'Wandstärke', min: 1.2, max: 6, step: 0.1, def: 2.4, u: 'mm' },
    { k: 'sockelDeck', l: 'Deckelstärke', min: 2.5, max: 6, step: 0.1, def: 3.2, u: 'mm' },
    { k: 'kabelD', l: 'Kabelschlitz', min: 0, max: 16, step: 0.5, def: 8, u: 'mm' },
  ]},
  { group: 'Darstellung & Export', items: [
    { k: 'farbe', l: 'Farbe', type: 'color', def: '#e9dcc4' },
    { k: 'aufloesung', l: 'Auflösung', min: 40, max: 400, step: 10, def: 140, u: '' },
    { k: 'druckUmdrehen', l: 'Beim Export so drehen, dass die Fassung auf dem Druckbett liegt', type: 'check', def: true },
  ]},
];
const ITEMS = SCHEMA.flatMap(g => g.items);
const DEFAULTS = Object.fromEntries(ITEMS.map(i => [i.k, i.def]));
const LOCH = { e27: 42, e14: 29, gu10: 36 };

// Nachbau der Mesh-Tischlampe (feines Geflecht, abgerundetes Viereck, verdreht, mit Sockel)
const MESH_LAMPE = {
  hoehe: 240, radiusUnten: 66, radiusOben: 66, bauch: 5, bauchPos: 0.45,
  querschnitt: '4', eckigkeit: 5, verdrehung: 40, verdrehVerlauf: 'linear',
  muster: 'geflecht', straenge: 120, drehung: 0.4, strangBreite: 1.5, strangTiefe: 1.1, webTiefe: 0.3,
  randHoehe: 4, randDicke: 2.2,
  fassung: true, fassungPos: 'sockel', fassungTyp: 'e27', lochD: 42,
  sockel: true, sockelHoehe: 70, sockelUeberstand: 3, farbe: '#d97a2b',
};

// Nachbau der gestapelten Kissen-Lampe
const KISSEN = {
  ...MESH_LAMPE, hoehe: 250, radiusUnten: 84, radiusOben: 72, bauch: 0, eckigkeit: 3.2, verdrehung: 0,
  rillenForm: 'kissen', rillenAnzahl: 4, rillenAmp: 10, prallheit: 0.2, drehung: 0.28, webTiefe: 0.25,
  randHoehe: 3, sockelHoehe: 55, sockelUeberstand: 1, einsatz: 'puck', puckD: 70, einsatzTiefe: 8, farbe: '#e0863a',
};

// Nachbau „Woven Light Mesh“ nach den Slicer-Ansichten: dichtes Leinwandgeflecht, verdrehte Falte unten,
// abgerundete Kanten, Boden im Schirm mit Kragen und Aussparungen für die E27-Fassung
const WOVEN_LIGHT = {
  hoehe: 240, radiusUnten: 80, radiusOben: 80, bauch: -3, bauchPos: 0.4,
  querschnitt: '4', eckigkeit: 4.2, seitenVerhaeltnis: 1,
  verdrehung: 30, verdrehVerlauf: 'lokal', verdrehMitte: 0.38, verdrehBreite: 0.2,
  kanteUnten: 8, kanteOben: 10,
  muster: 'geflecht', webart: 'leinwand', straenge: 150, drehung: 0.36,
  strangBreite: 2, strangTiefe: 1.2, webTiefe: 0.45,
  randHoehe: 2.5, randDicke: 2.2,
  fassung: true, fassungPos: 'boden', einsatz: 'fassung', fassungTyp: 'e27', lochD: 42,
  bodenDicke: 2.4, kragen: 6, nasen: 4, fassRing: 8,
  sockel: false, farbe: '#eee4da',
};

// Gleiche Lampe für das LED-Panel 120 × 160 mm: Querschnitt gestreckt, Panel liegt im Rahmen auf dem Boden
const WOVEN_PANEL = {
  ...WOVEN_LIGHT, radiusUnten: 86, radiusOben: 86, seitenVerhaeltnis: 1.3, straenge: 176, drehung: 0.26,
  einsatz: 'panel', panelB: 120, panelL: 160, panelEcke: 2, einsatzTiefe: 4, falz: 4,
};

// Dieselben Lampen mit getrenntem Sockel: Schirm und Sockel sind zwei Teile, der Schirmrand steckt in der Nut des Sockels.
// Im hohlen Sockel ist Platz für Fassungskörper, Treiber und Kabel; das Kabel läuft durch den Schlitz in der Wand.
const SOCKEL_TEIL = { fassungPos: 'sockel', sockel: true, sockelUeberstand: 2, sockelWand: 2.4, sockelDeck: 3.2, kabelD: 8, kanteUnten: 3 };
const WOVEN_SOCKEL = { ...WOVEN_LIGHT, ...SOCKEL_TEIL, sockelHoehe: 60 };
const WOVEN_PANEL_SOCKEL = { ...WOVEN_PANEL, ...SOCKEL_TEIL, sockelHoehe: 45 };

const PRESETS = {
  'Woven Light': WOVEN_LIGHT,
  'Woven Light · Panel 120×160': WOVEN_PANEL,
  'Woven Light · Sockel getrennt': WOVEN_SOCKEL,
  'Panel 120×160 · Sockel getrennt': WOVEN_PANEL_SOCKEL,
  'Mesh Tischlampe': MESH_LAMPE,
  'Kissen-Stapel': KISSEN,

    verdrehung: 35, verdrehVerlauf: 's', drehung: 0.3, sockelHoehe: 60 },
  'Woven Mesh': {},
  'Propeller': { muster: 'rechts', straenge: 12, drehung: 0.3, strangBreite: 7, strangTiefe: 1.2, webTiefe: 0,
    hoehe: 150, radiusUnten: 85, radiusOben: 85, bauch: 18, zwischenRinge: 1 },
  'Diamant': { straenge: 9, drehung: 0.3, strangBreite: 3.2, strangTiefe: 2, webTiefe: 0.6,
    radiusUnten: 110, radiusOben: 40, bauch: 0, hoehe: 170, zwischenRinge: 2 },
  'Tulpe': { hoehe: 220, radiusUnten: 45, radiusOben: 105, bauch: 22, bauchPos: 0.35, straenge: 22, drehung: 0.4,
    strangBreite: 2, fassungPos: 'unten' },
  'Welle': { rillenAmp: 6, rillenAnzahl: 4, straenge: 14, drehung: 0.15, wellenAmp: 2.5, wellenFreq: 4,
    webTiefe: 0, radiusUnten: 80, radiusOben: 80, bauch: 10 },
  'Käfig': { muster: 'keine', rippen: 24, zwischenRinge: 7, strangBreite: 2.2, strangTiefe: 1.8,

  'Kugel': { hoehe: 210, radiusUnten: 40, radiusOben: 40, bauch: 65, bauchPos: 0.5, straenge: 18, drehung: 0.25,

let P = { ...DEFAULTS };

/* =====================================================================
   Geometrie (z nach oben, Einheit mm)
   ===================================================================== */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const area2 = loop => { let a = 0; for (let i = 0; i < loop.length; i++) { const p = loop[i], q = loop[(i + 1) % loop.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };

class MeshBuilder {
  constructor() { this.pos = []; this.idx = []; this.volume = 0; }
  get vcount() { return this.pos.length / 3; }
  v(x, y, z) { this.pos.push(x, y, z); }

  // Rechteckprofil (Breite w entlang B, Tiefe d entlang N) entlang eines Pfades
  addTube(C, N, B, w, d, closed) {
    const n = C.length, hw = w / 2, hd = d / 2;
    const sn = [1, 1, -1, -1], sb = [1, -1, -1, 1];
    const corner = (i, k) => this.v(
      C[i][0] + N[i][0] * sn[k] * hd + B[i][0] * sb[k] * hw,
      C[i][1] + N[i][1] * sn[k] * hd + B[i][1] * sb[k] * hw,
      C[i][2] + N[i][2] * sn[k] * hd + B[i][2] * sb[k] * hw);
    const base = this.vcount;
    for (let i = 0; i < n; i++)
      for (let k = 0; k < 4; k++) { corner(i, k); corner(i, (k + 1) % 4); }
    const segs = closed ? n : n - 1;
    let length = 0;
    for (let i = 0; i < segs; i++) {
      const i2 = (i + 1) % n;
      length += len(sub(C[i2], C[i]));
      for (let k = 0; k < 4; k++) {
        const a = base + i * 8 + k * 2, b = a + 1;
        const c = base + i2 * 8 + k * 2 + 1, e = base + i2 * 8 + k * 2;
        this.idx.push(a, c, b, a, e, c);
      }
    }
    if (!closed) {
      let s = this.vcount;
      for (let k = 0; k < 4; k++) corner(0, k);
      this.idx.push(s, s + 1, s + 2, s, s + 2, s + 3);
      s = this.vcount;
      for (let k = 0; k < 4; k++) corner(n - 1, k);
      this.idx.push(s, s + 2, s + 1, s, s + 3, s + 2);
    }
    this.volume += length * w * d;
    return length;
  }

  // Geschlossener Ringkörper zwischen zwei Umrissen (gegen den Uhrzeigersinn, gleiche Punktzahl).
  // zb darf ein Array sein (z. B. für einen Kabelschlitz in der Wand).
  addExtrudedRing(outer, inner, zb, zt) {
    const M = outer.length, zB = i => Array.isArray(zb) ? zb[i] : zb;
    let b = this.vcount;
    for (let i = 0; i < M; i++) { this.v(outer[i][0], outer[i][1], zB(i)); this.v(outer[i][0], outer[i][1], zt); }
    for (let i = 0; i < M; i++) { const j = (i + 1) % M; this.idx.push(b + 2 * i, b + 2 * j, b + 2 * j + 1, b + 2 * i, b + 2 * j + 1, b + 2 * i + 1); }
    b = this.vcount;
    for (let i = 0; i < M; i++) { this.v(inner[i][0], inner[i][1], zB(i)); this.v(inner[i][0], inner[i][1], zt); }
    for (let i = 0; i < M; i++) { const j = (i + 1) % M; this.idx.push(b + 2 * i, b + 2 * j + 1, b + 2 * j, b + 2 * i, b + 2 * i + 1, b + 2 * j + 1); }
    b = this.vcount;
    for (let i = 0; i < M; i++) { this.v(outer[i][0], outer[i][1], zt); this.v(inner[i][0], inner[i][1], zt); }
    for (let i = 0; i < M; i++) { const j = (i + 1) % M; this.idx.push(b + 2 * i, b + 2 * j, b + 2 * j + 1, b + 2 * i, b + 2 * j + 1, b + 2 * i + 1); }
    b = this.vcount;
    for (let i = 0; i < M; i++) { this.v(outer[i][0], outer[i][1], zB(i)); this.v(inner[i][0], inner[i][1], zB(i)); }
    for (let i = 0; i < M; i++) { const j = (i + 1) % M; this.idx.push(b + 2 * i, b + 2 * j + 1, b + 2 * j, b + 2 * i, b + 2 * i + 1, b + 2 * j + 1); }
    const zAvg = Array.isArray(zb) ? zb.reduce((a, c) => a + c, 0) / M : zb;
    this.volume += (area2(outer) - area2(inner)) * (zt - zAvg);
  }
}

function makeProfile(p) {
  const H = p.hoehe;
  // Abgerundete Kante: Kreisbogen, aber nur bis 35° Neigung. Diagonale Stränge liegen darauf noch steiler,
  // mit 35° bleiben sie bei etwa 55° und damit ohne Stützen druckbar.
  const EDGE = 35 * Math.PI / 180;
  const edge = (z, r) => {
    if (r <= 0) return 0;
    const h = r * Math.sin(EDGE);
    if (z >= h) return 0;
    const d = h - z;
    return r - Math.sqrt(r * r - d * d);
  };
  const R = t => {
    const lin = p.radiusUnten + (p.radiusOben - p.radiusUnten) * t;
    const q = p.bauchPos;
    const bump = t < q ? Math.sin(Math.PI / 2 * t / q) ** 2 : Math.sin(Math.PI / 2 * (1 - t) / (1 - q)) ** 2;
    // Kissen: n Etagen, dazwischen eingeschnürt; kleiner Exponent = prallere, flachere Kissen
    const rillen = p.rillenForm === 'kissen'
      ? p.rillenAmp * (Math.pow(Math.abs(Math.sin(p.rillenAnzahl * Math.PI * t)), 1 - 0.85 * p.prallheit) - 1)
      : p.rillenAmp * Math.sin(p.rillenAnzahl * 2 * Math.PI * t);
    const kanten = edge(t * H, p.kanteUnten) + edge((1 - t) * H, p.kanteOben);
    return Math.max(8, lin + p.bauch * bump + rillen - kanten);
  };
  return { H, R };
}

// Querschnitt als Superformel: n Ecken, Exponent m (2 = Kreis, groß = scharfe Ecken).
// Der Radius-Parameter ist der Abstand zur Seitenmitte in x; in y wird er mit dem Seitenverhältnis gestreckt.
function makeShape(p) {
  const n = parseInt(p.querschnitt, 10) || 0, m = p.eckigkeit, asp = p.seitenVerhaeltnis;
  const rho = n === 0 ? () => 1
    : phi => Math.pow(Math.abs(Math.cos(n * phi / 4)) ** m + Math.abs(Math.sin(n * phi / 4)) ** m, -1 / m);
  const local = phi => { const r = rho(phi); return [r * Math.cos(phi), asp * r * Math.sin(phi)]; };
  // Tabelle Bogenlänge -> Winkel, damit Stränge auch an den Ecken gleichmäßig verteilt sind
  const K = 2048, cum = new Float64Array(K + 1);
  let [px, py] = local(0), maxRho = Math.hypot(px, py);
  for (let k = 1; k <= K; k++) {
    const [x, y] = local(2 * Math.PI * k / K);
    cum[k] = cum[k - 1] + Math.hypot(x - px, y - py);
    px = x; py = y; maxRho = Math.max(maxRho, Math.hypot(x, y));
  }
  const total = cum[K];
  const phiOfS = s => {
    const target = (((s % 1) + 1) % 1) * total;
    let lo = 0, hi = K;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= target) lo = mid; else hi = mid; }
    const f = (target - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
    return 2 * Math.PI * (lo + f) / K;
  };
  // Abstand zum Rand in Richtung b (lokales Koordinatensystem, ohne Verdrehung)
  const radiusDir = b => Math.hypot(...local(Math.atan2(Math.sin(b) / asp, Math.cos(b))));
  return { local, phiOfS, maxRho, perimeterUnit: total, radiusDir };
}

function makeSurface(p) {
  const { H, R } = makeProfile(p);
  const shape = makeShape(p);
  const twTotal = p.verdrehung * Math.PI / 180;
  let twf = t => t;
  if (p.verdrehVerlauf === 's') twf = t => (1 - Math.cos(Math.PI * t)) / 2;
  else if (p.verdrehVerlauf === 'welle') twf = t => Math.sin(Math.PI * t);
  else if (p.verdrehVerlauf === 'lokal') {
    // Verdrehung auf eine Zone konzentriert: erzeugt die schräge Falte wie bei einer verdrehten Papiertüte
    const g = t => Math.tanh((t - p.verdrehMitte) / p.verdrehBreite), g0 = g(0), g1 = g(1);
    twf = t => (g(t) - g0) / (g1 - g0);
  }
  const tw = t => twTotal * twf(t);
  const S = (s, t) => {
    const [lx, ly] = shape.local(shape.phiOfS(s)), r = R(t), a = tw(t), c = Math.cos(a), sn = Math.sin(a);
    return [r * (lx * c - ly * sn), r * (lx * sn + ly * c), t * H];
  };
  const e = 1e-4;
  const normal = (s, t) => {
    const ds = sub(S(s + e, t), S(s - e, t));
    const dt = sub(S(s, Math.min(1, t + e)), S(s, Math.max(0, t - e)));
    return norm(cross(ds, dt));
  };
  const hNormal = (s, t) => {
    const ds = sub(S(s + e, t), S(s - e, t));
    return norm([ds[1], -ds[0], 0]);
  };
  const radiusAt = (a, t) => R(t) * shape.radiusDir(a - tw(t));
  return { H, R, S, normal, hNormal, radiusAt, shape };
}

// Frames entlang eines Pfades; N liegt senkrecht auf der Mantelfläche
function frames(Pts, normals) {
  const n = Pts.length, T = [], N = [], B = [];
  for (let i = 0; i < n; i++) {
    const t = norm(sub(Pts[Math.min(n - 1, i + 1)], Pts[Math.max(0, i - 1)]));
    const s = normals[i], k = dot(s, t);
    const nn = norm([s[0] - t[0] * k, s[1] - t[1] * k, s[2] - t[2] * k]);
    T.push(t); N.push(nn); B.push(cross(t, nn));
  }
  return { T, N, B };
}

// Webarten: Folge über/unter entlang eines Strangs (Periode = Länge)
const WEBART = { leinwand: [1, -1], koeper22: [1, 1, -1, -1], koeper21: [1, 1, -1] };

function buildLampshade(p) {
  const mb = new MeshBuilder();
  const surf = makeSurface(p);
  const { H, R, S, normal, hNormal } = surf;
  const waveS = p.wellenAmp / 360;
  const res = p.aufloesung;
  const woven = p.muster === 'geflecht' && p.drehung > 0;
  const weaveOn = woven && p.webTiefe > 0;
  const pattern = WEBART[p.webart] || WEBART.leinwand, per = pattern.length;
  // Damit das Muster rundum aufgeht, muss die Strangzahl ein Vielfaches der Periode sein
  const n = weaveOn ? Math.ceil(p.straenge / per) * per : p.straenge;
  const pat = k => pattern[((k % per) + per) % per];
  let maxOverhang = 0;

  const strand = (s0, idx, dir, weave) => {
    const crossings = weave ? 2 * p.drehung * n : 0;
    const segs = Math.min(1600, Math.max(20, Math.round(res * Math.max(1, Math.abs(dir) * p.drehung * 1.5)), Math.ceil(crossings * 3)));
    const pts = [], nrm = [];
    let prev = null;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const s = s0 + dir * p.drehung * t + waveS * Math.sin(p.wellenFreq * 2 * Math.PI * t);
      const c = S(s, t), nS = normal(s, t);
      // Überhang am Strangverlauf ohne Webversatz messen; der Versatz ist nur ein Bruchteil eines Millimeters je Schicht
      if (prev) {
        const d = sub(c, prev);
        maxOverhang = Math.max(maxOverhang, Math.acos(Math.min(1, Math.abs(d[2]) / (len(d) || 1))) * 180 / Math.PI);
      }
      prev = c;
      let off = 0;
      if (weave) {
        // k-te Kreuzung entlang des Strangs; zwischen den Kreuzungen weich überblenden
        const kf = crossings * t, k0 = Math.floor(kf), fr = kf - k0;
        const v = dir > 0 ? k => pat(k + 2 * idx) : k => -pat(2 * idx - k);
        const v0 = v(k0), v1 = v(k0 + 1);
        off = p.webTiefe * (v0 + (v1 - v0) * (1 - Math.cos(Math.PI * fr)) / 2);
      }
      pts.push([c[0] + nS[0] * off, c[1] + nS[1] * off, c[2] + nS[2] * off]);
      nrm.push(nS);
    }
    const { N, B } = frames(pts, nrm);
    mb.addTube(pts, N, B, p.strangBreite, p.strangTiefe, false);
  };

  // Ring entlang des Querschnitts, senkrechtes Rechteckprofil
  const ring = (t, height, thick) => {
    const segs = Math.max(128, Math.round(res * 1.5));
    const pts = [], N = [], B = [];
    for (let i = 0; i < segs; i++) {
      const s = i / segs, c = S(s, t);
      const nh = hNormal(s, t);
      const tan = [-nh[1], nh[0], 0];
      pts.push(c); N.push(nh); B.push(cross(tan, nh));
    }
    mb.addTube(pts, N, B, height, thick, true);
  };

  // Geflecht
  if (p.muster !== 'keine') {
    const dirs = p.muster === 'geflecht' ? (p.drehung > 0 ? [1, -1] : [1])
               : p.muster === 'rechts' ? [1] : [-1];
    for (const dir of dirs)
      for (let i = 0; i < n; i++) strand(i / n, i, dir, weaveOn);
  }
  // Senkrechte Rippen
  for (let i = 0; i < p.rippen; i++) strand((i + 0.5) / p.rippen, 0, 0, false);

  // Zwischenringe
  const ringThick = p.strangTiefe + (weaveOn ? 2 * p.webTiefe : 0);
  for (let k = 1; k <= p.zwischenRinge; k++) {
    const t = k / (p.zwischenRinge + 1);
    ring(t, p.strangBreite, ringThick);
  }

  // Ränder
  const mount = p.fassung ? p.fassungPos : 'keine';
  const inShade = mount === 'oben' || mount === 'unten';
  const rimThick = Math.max(p.randDicke, ringThick);
  const rimBottomH = mount === 'unten' ? Math.max(p.randHoehe, p.speichenHoehe)
                   : mount === 'boden' ? Math.max(p.randHoehe, p.bodenDicke) : p.randHoehe;
  const rimTopH = mount === 'oben' ? Math.max(p.randHoehe, p.speichenHoehe) : p.randHoehe;
  if (rimBottomH > 0) ring(rimBottomH / 2 / H, rimBottomH, rimThick);
  if (rimTopH > 0) ring(1 - rimTopH / 2 / H, rimTopH, rimThick);

  // Fassungshalter mit Speichen im Schirm
  const warnings = [];
  if (inShade) {
    const sh = p.speichenHoehe;
    const zc = mount === 'oben' ? H - sh / 2 : sh / 2;
    const holeR = p.lochD / 2;
    const segs = 96, pts = [], N = [], B = [];
    for (let i = 0; i < segs; i++) {
      const a = 2 * Math.PI * i / segs, r = holeR + p.fassRing / 2;
      pts.push([r * Math.cos(a), r * Math.sin(a), zc]); N.push([Math.cos(a), Math.sin(a), 0]); B.push([0, 0, -1]);
    }
    mb.addTube(pts, N, B, sh, p.fassRing, true);
    const r0 = holeR + p.fassRing * 0.6;
    let tooBig = false;
    for (let i = 0; i < p.speichen; i++) {
      const a = 2 * Math.PI * (i + 0.5) / p.speichen;
      const r1 = surf.radiusAt(a, zc / H);
      if (r1 - r0 < 3) { tooBig = true; continue; }
      const dirv = [Math.cos(a), Math.sin(a), 0], up = [0, 0, 1], Bv = cross(dirv, up);
      mb.addTube([[dirv[0] * r0, dirv[1] * r0, zc], [dirv[0] * r1, dirv[1] * r1, zc]], [up, up], [Bv, Bv], p.speichenBreite, sh, false);
    }
    if (tooBig) warnings.push('Loch plus Ring ist fast so groß wie der Schirm an dieser Stelle. Einige Speichen fallen weg.');
  }

  // Vollboden im Schirm mit Fassung, Puck oder Panel
  if (mount === 'boden') buildFloor(mb, p, surf, rimThick, warnings);

  // Alles auf 0..H begrenzen (flache Auflageflächen)
  for (let i = 2; i < mb.pos.length; i += 3) mb.pos[i] = Math.min(H, Math.max(0, mb.pos[i]));

  // Sockel
  const base = p.sockel ? buildBase(p, surf, rimThick, warnings) : null;

  // Kennzahlen
  let maxX = 0, maxY = 0;
  for (let i = 0; i < mb.pos.length; i += 3) { maxX = Math.max(maxX, Math.abs(mb.pos[i])); maxY = Math.max(maxY, Math.abs(mb.pos[i + 1])); }
  if (base) for (let i = 0; i < base.pos.length; i += 3) { maxX = Math.max(maxX, Math.abs(base.pos[i])); maxY = Math.max(maxY, Math.abs(base.pos[i + 1])); }
  let maxR = 0;
  for (let s = 0; s <= 100; s++) maxR = Math.max(maxR, R(s / 100) * surf.shape.maxRho);

  if (woven && 2 * p.webTiefe >= p.strangTiefe)
    warnings.push('Webversatz ist zu groß: Die Stränge berühren sich an den Kreuzungen nicht mehr. Webversatz unter ' + (p.strangTiefe / 2).toFixed(2) + ' mm halten.');
  if (maxOverhang > 55)
    warnings.push(`Stränge sind bis zu ${maxOverhang.toFixed(0)}° geneigt. Ab etwa 55° wird der Druck ohne Stützen unsauber. Weniger Drehung, weniger Verdrehung oder mehr Höhe hilft.`);
  if (p.strangBreite < 1.2 || p.strangTiefe < 1)
    warnings.push('Sehr feine Stränge: Mit 0,4-mm-Düse langsam drucken und Linienbreite im Slicer prüfen.');
  if (p.muster === 'keine' && p.rippen === 0)
    warnings.push('Kein Geflecht und keine Rippen: Die Ränder hängen lose.');
  if (mount === 'sockel' && !p.sockel)
    warnings.push('Fassung ist „Im Sockel“ eingestellt, der Sockel ist aber aus.');
  if (p.fassung && p.einsatz !== 'fassung' && mount !== 'sockel' && mount !== 'boden')
    warnings.push('LED-Puck und LED-Panel gehen nur mit „Boden im Schirm“ oder „Im Sockel“.');
  const tris = (mb.idx.length + (base ? base.idx.length : 0)) / 3;
  if (tris > 1500000)
    warnings.push('Sehr viele Dreiecke. Auflösung oder Strangzahl senken, falls der Slicer langsam wird.');
  if (!warnings.length) warnings.push({ ok: 'Druckbar ohne Stützstrukturen (Überhang max. ' + maxOverhang.toFixed(0) + '°).' });

  return {
    positions: new Float32Array(mb.pos),
    indices: new Uint32Array(mb.idx),
    base: base ? { positions: new Float32Array(base.pos), indices: new Uint32Array(base.idx), height: p.sockelHoehe } : null,
    stats: { H, width: 2 * maxX, depth: 2 * maxY, volume: mb.volume + (base ? base.volume : 0), tris, maxOverhang, maxR,
      baseH: base ? p.sockelHoehe : 0, strands: n },
    warnings,
  };
}

// Umrisse für Fassung, Puck oder Panel, abgetastet an den Winkeln angs
function insertLoops(p, ins, angs) {
  const loop = (hx, hy, rr) => angs.map(a => { const r = rrectRadius(a, hx, hy, rr); return [r * Math.cos(a), r * Math.sin(a)]; });
  let cut;
  if (ins.kind === 'fassung' && p.nasen > 0) {
    // Loch mit Aussparungen (Nasen der Fassung bzw. Bajonett), je 6 mm breit und 2,5 mm tief
    const half = 3 / ins.hx;
    cut = angs.map(a => {
      let d = Infinity;
      for (let k = 0; k < p.nasen; k++) {
        const c = 2 * Math.PI * k / p.nasen + Math.PI / 4;
        d = Math.min(d, Math.abs(Math.atan2(Math.sin(a - c), Math.cos(a - c))));
      }
      const r = ins.hx + (d < half ? 2.5 : 0);
      return [r * Math.cos(a), r * Math.sin(a)];
    });
  } else cut = loop(ins.hx, ins.hy, ins.rr);
  const f = ins.ledge, w = 2.4;
  return {
    cut,
    ledge: loop(Math.max(2, ins.hx - f), Math.max(2, ins.hy - f), Math.max(0, ins.rr - f)),
    frame: loop(ins.hx + w, ins.hy + w, ins.rr + w),
    kragen: loop(ins.hx + p.fassRing, ins.hy + p.fassRing, ins.rr + p.fassRing),
  };
}

// Boden im Schirm (wie beim Original): Platte mit Loch, Kragen um die Fassung bzw. Rahmen um Puck/Panel.
// Wird mit dem Boden auf dem Druckbett gedruckt, alles wächst nach oben.
function buildFloor(mb, p, surf, rimThick, warnings) {
  const { S, hNormal } = surf;
  const M = Math.max(360, Math.round(p.aufloesung * 2.5));
  const outer = [], innerR = [];
  for (let i = 0; i < M; i++) {
    const s = i / M, c = S(s, 0), nh = hNormal(s, 0);
    outer.push([c[0] + nh[0] * (rimThick / 2 - 0.1), c[1] + nh[1] * (rimThick / 2 - 0.1)]);
    innerR.push(Math.hypot(c[0] - nh[0] * rimThick / 2, c[1] - nh[1] * rimThick / 2));
  }
  const angs = outer.map(([x, y]) => Math.atan2(y, x));
  const ins = insertSpec(p, surf.R(0));
  const L = insertLoops(p, ins, angs);
  const T = p.bodenDicke;
  let fence = null, fenceH = 0;
  if (ins.kind === 'fassung') {
    mb.addExtrudedRing(outer, L.cut, 0, T);
    if (p.kragen > 0) { fence = L.kragen; fenceH = T + p.kragen; mb.addExtrudedRing(L.kragen, L.cut, 0, fenceH); }
  } else {
    // Puck/Panel liegt auf der Auflagekante, der Rahmen hält es seitlich
    mb.addExtrudedRing(outer, ins.depth > 0 ? L.ledge : L.cut, 0, T);
    if (ins.depth > 0) { fence = L.frame; fenceH = T + ins.depth; mb.addExtrudedRing(L.frame, L.cut, 0, fenceH); }
  }
  const check = fence || L.cut;
  if (check.some((pt, i) => Math.hypot(...pt) + 1 > innerR[i]))
    warnings.push(ins.kind === 'panel' ? 'Das LED-Panel passt nicht in den Boden. Radius unten oder Seitenverhältnis vergrößern.'
      : ins.kind === 'puck' ? 'Der LED-Puck passt nicht in den Boden.' : 'Fassungsloch plus Kragen passt nicht in den Boden.');
}

// Hohler Sockel: Wand mit Kabelschlitz, Deckel mit Fassungsloch und Nut, in der der Schirmrand sitzt.
function buildBase(p, surf, rimThick, warnings) {
  const mb = new MeshBuilder();
  const { S, hNormal, shape, R } = surf;
  const M = Math.max(240, Math.round(p.aufloesung * 1.8));
  const bh = p.sockelHoehe, gap = 0.3, grooveDepth = 1.6;
  const off = u => { const out = []; for (let i = 0; i < M; i++) { const s = i / M, c = S(s, 0), nh = hNormal(s, 0); out.push([c[0] + nh[0] * u, c[1] + nh[1] * u]); } return out; };

  // Bei Kissen-Etagen ist der Schirm unten eingeschnürt: Sockel so breit wie das unterste Kissen
  let belly = 0;
  if (p.rillenForm === 'kissen' && p.rillenAmp > 0)
    for (let k = 0; k <= 50; k++) belly = Math.max(belly, R(k / 50 / p.rillenAnzahl) - R(0));
  const uOut = rimThick / 2 + gap + 1.2 + p.sockelUeberstand + belly;
  const outer = off(uOut), inner = off(uOut - p.sockelWand);
  // Kabelschlitz unten in der Wand, mittig auf der ersten Seite
  const perim = shape.perimeterUnit * R(0);
  const zb = [];
  for (let i = 0; i < M; i++) {
    let s = i / M; if (s > 0.5) s -= 1;
    zb.push(p.kabelD > 0 && Math.abs(s) * perim < p.kabelD / 2 ? Math.min(p.kabelD, bh - p.sockelDeck - 1) : 0);
  }
  mb.addExtrudedRing(outer, inner, zb, bh);

  // Deckel: außen voll, Nut für den Schirmrand, innen Ausschnitt für das Leuchtmittel
  const grooveO = off(rimThick / 2 + gap), grooveI = off(-rimThick / 2 - gap);
  const ins = insertSpec(p, R(0));
  const L = insertLoops(p, ins, grooveI.map(([x, y]) => Math.atan2(y, x)));
  const zDeck = bh - p.sockelDeck;
  mb.addExtrudedRing(outer, grooveO, zDeck, bh);
  mb.addExtrudedRing(grooveO, grooveI, zDeck, bh - grooveDepth);
  mb.addExtrudedRing(grooveI, L.cut, zDeck, bh);

  // Einlass für Puck oder Panel: Rahmen nach unten und umlaufende Auflagekante
  if (ins.depth > 0) {
    const depth = Math.min(ins.depth, bh - 6), ledgeT = 1.6;
    mb.addExtrudedRing(L.frame, L.cut, bh - depth - ledgeT, bh);
    mb.addExtrudedRing(L.cut, L.ledge, bh - depth - ledgeT, bh - depth);
  }

  // Passt der Ausschnitt in den Deckel?
  if (grooveI.some(([x, y], i) => Math.hypot(...L.cut[i]) + 3 > Math.hypot(x, y)))
    warnings.push(ins.kind === 'panel' ? 'Das LED-Panel ist zu groß für den Sockeldeckel. Panel kleiner wählen oder den Schirm unten breiter machen.'
      : ins.kind === 'puck' ? 'Der LED-Puck ist zu groß für den Sockeldeckel.' : 'Das Fassungsloch ist zu groß für den Sockeldeckel.');
  return mb;
}

// Ausschnitt für das Leuchtmittel: halbe Breite/Länge, Eckenradius, Einlasstiefe, Auflagekante (0,2 mm Spiel je Seite)
function insertSpec(p, r0) {
  if (!p.fassung || (p.fassungPos !== 'sockel' && p.fassungPos !== 'boden')) {
    const r = Math.min(15, r0 * 0.3);
    return { kind: 'kabel', hx: r, hy: r, rr: r, depth: 0, ledge: 0 };
  }
  if (p.einsatz === 'puck') {
    const r = p.puckD / 2 + 0.2;
    return { kind: 'puck', hx: r, hy: r, rr: r, depth: p.einsatzTiefe, ledge: p.falz };
  }
  if (p.einsatz === 'panel') {
    const hx = p.panelB / 2 + 0.2, hy = p.panelL / 2 + 0.2;
    return { kind: 'panel', hx, hy, rr: Math.min(p.panelEcke, hx, hy), depth: p.einsatzTiefe, ledge: p.falz };
  }
  const r = p.lochD / 2;
  return { kind: 'fassung', hx: r, hy: r, rr: r, depth: 0, ledge: 0 };
}

// Abstand vom Mittelpunkt zum Rand eines abgerundeten Rechtecks in Richtung a
function rrectRadius(a, hx, hy, rr) {
  const c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
  let t = Math.min(c > 1e-9 ? hx / c : Infinity, s > 1e-9 ? hy / s : Infinity);
  const cx = hx - rr, cy = hy - rr;
  if (rr > 0 && t * c > cx + 1e-9 && t * s > cy + 1e-9) {
    const b = c * cx + s * cy;
    t = b + Math.sqrt(Math.max(0, b * b - (cx * cx + cy * cy - rr * rr)));
  }
  return t;
}

/* =====================================================================
   STL-Export (binär)
   ===================================================================== */
function toSTL(pos, idx, flip, H) {
  const tris = idx.length / 3;
  const buf = new ArrayBuffer(84 + tris * 50);
  const dv = new DataView(buf);
  const head = 'Lampenschirm Studio - parametrischer Lampenschirm';
  for (let i = 0; i < 80; i++) dv.setUint8(i, i < head.length ? head.charCodeAt(i) : 32);
  dv.setUint32(80, tris, true);
  const v = i => flip ? [pos[i * 3], -pos[i * 3 + 1], H - pos[i * 3 + 2]] : [pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]];
  let o = 84;
  for (let t = 0; t < tris; t++) {
    const a = v(idx[t * 3]), b = v(idx[t * 3 + 1]), c = v(idx[t * 3 + 2]);
    const nn = norm(cross(sub(b, a), sub(c, a)));
    for (const val of [...nn, ...a, ...b, ...c]) { dv.setFloat32(o, val, true); o += 4; }
    dv.setUint16(o, 0, true); o += 2;
  }
  return buf;
}

function download(data, name, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* =====================================================================
   3D-Ansicht
   ===================================================================== */
THREE.Object3D.DEFAULT_UP.set(0, 0, 1);
const host = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Tagmodus
const hemi = new THREE.HemisphereLight(0xfff4e6, 0x3a3128, 1.3);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(hemi, sun, sun.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShadowMaterial({ opacity: 0.28 }));
floor.receiveShadow = true;
const grid = new THREE.GridHelper(1, 20, 0x5a4d3d, 0x3a3128);
grid.rotation.x = Math.PI / 2;
scene.add(floor, grid);

// Nachtmodus
const room = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 96, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xd9cbb5, roughness: 0.95, side: THREE.BackSide }));
room.rotation.x = Math.PI / 2;
room.receiveShadow = true;
const roomFloor = new THREE.Mesh(new THREE.CircleGeometry(1, 96), new THREE.MeshStandardMaterial({ color: 0x6b5a48, roughness: 1 }));
roomFloor.receiveShadow = true;
const bulbLight = new THREE.PointLight(0xffc27a, 2.2, 0, 0);
bulbLight.castShadow = true;
bulbLight.shadow.mapSize.set(2048, 2048);
bulbLight.shadow.camera.near = 2;
bulbLight.shadow.bias = -0.002;
const bulb = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.MeshBasicMaterial({ color: 0xfff1d6 }));
const nightAmbient = new THREE.AmbientLight(0x8a6f55, 0.3);
const nightGroup = new THREE.Group();
nightGroup.add(room, roomFloor, bulbLight, bulb, nightAmbient);
scene.add(nightGroup);

const lampGroup = new THREE.Group();
scene.add(lampGroup);
const material = new THREE.MeshStandardMaterial({ color: P.farbe, roughness: 0.55, metalness: 0 });
const baseMaterial = new THREE.MeshStandardMaterial({ color: P.farbe, roughness: 0.7, metalness: 0 });
const shade = new THREE.Mesh(new THREE.BufferGeometry(), material);
const baseMesh = new THREE.Mesh(new THREE.BufferGeometry(), baseMaterial);
for (const m of [shade, baseMesh]) { m.castShadow = true; m.receiveShadow = true; lampGroup.add(m); }
// LED-Puck bzw. LED-Panel im Sockeldeckel (nur Vorschau)
const ledMaterial = new THREE.MeshStandardMaterial({ color: 0xf1ede4, roughness: 0.4 });
const ledPanel = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), ledMaterial);
const ledPuck = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 64), ledMaterial);
ledPuck.rotation.x = Math.PI / 2;
lampGroup.add(ledPanel, ledPuck);

let night = false;
let exploded = false;
let current = null;
let firstFrame = true;

function applyScene() {
  const s = current.stats, H = s.H, totalH = H + s.baseH;
  const size = Math.max(totalH, s.width, s.depth);
  const lift = night && !s.baseH && P.fassungPos !== 'boden' ? H * 0.9 : 0;
  lampGroup.position.z = lift;
  // Schirmrand sitzt in der Nut des Sockels; zerlegt schwebt der Schirm darüber
  shade.position.z = s.baseH ? s.baseH - 1.6 + (exploded ? Math.max(40, H * 0.3) : 0) : 0;

  scene.background = new THREE.Color(night ? 0x0b0907 : 0x2a241d);
  hemi.visible = sun.visible = floor.visible = grid.visible = !night;
  nightGroup.visible = night;
  renderer.toneMappingExposure = night ? 1.1 : 1.0;

  floor.scale.set(size * 6, size * 6, 1);
  grid.scale.set(size * 3, 1, size * 3);
  sun.position.set(size * 1.2, -size * 1.6, size * 2.4);
  sun.target.position.set(0, 0, totalH / 2);
  const sc = sun.shadow.camera;
  sc.left = sc.bottom = -size * 1.3; sc.right = sc.top = size * 1.3;
  sc.near = 1; sc.far = size * 8; sc.updateProjectionMatrix();

  const roomR = Math.max(s.maxR * 7, totalH * 3.2);
  const roomH = totalH * 4;
  room.scale.set(roomR, roomH, roomR);
  room.position.set(0, 0, roomH / 2);
  roomFloor.scale.set(roomR, roomR, 1);
  const mount = P.fassung ? P.fassungPos : 'keine';
  const inFloor = mount === 'boden';
  const led = ((mount === 'sockel' && s.baseH) || inFloor) && P.einsatz !== 'fassung' ? P.einsatz : null;
  const bulbZ = lift + (led ? s.baseH + (inFloor ? P.bodenDicke : 0) + 25
    : (mount === 'sockel' && s.baseH) || inFloor ? s.baseH + Math.min(55, H * 0.3)
    : mount === 'oben' ? s.baseH + H * 0.62 : mount === 'unten' ? s.baseH + H * 0.38 : s.baseH + H / 2);
  bulbLight.position.set(0, 0, bulbZ);
  bulbLight.shadow.camera.far = roomR * 3;
  bulb.visible = !led;
  bulb.position.set(0, 0, bulbZ);
  bulb.scale.setScalar(Math.min(s.maxR * 0.3, 30));
  // Im Sockel sitzt das Leuchtmittel versenkt im Deckel, im Schirmboden liegt es auf der Bodenplatte
  const ledT = inFloor ? Math.max(2, P.einsatzTiefe) : Math.max(2, Math.min(P.einsatzTiefe, s.baseH - 6));
  ledPanel.visible = led === 'panel';
  ledPuck.visible = led === 'puck';
  ledPanel.scale.set(P.panelB, P.panelL, ledT);
  ledPuck.scale.set(P.puckD / 2, ledT, P.puckD / 2);
  ledPanel.position.z = ledPuck.position.z = inFloor ? P.bodenDicke + ledT / 2 : s.baseH - ledT / 2;
  ledMaterial.emissive.set(night ? 0xfff1d6 : 0x000000);
  material.emissive.set(night ? P.farbe : 0x000000).multiplyScalar(night ? 0.3 : 1); // Filament leuchtet durch
  controls.maxDistance = night ? roomR * 0.92 : size * 10;
}

function frameCamera() {
  const s = current.stats, totalH = s.H + s.baseH + (exploded && s.baseH ? Math.max(40, s.H * 0.3) : 0), size = Math.max(totalH, s.width, s.depth);
  const cz = lampGroup.position.z + totalH / 2;
  controls.target.set(0, 0, cz);
  const dist = night ? Math.min(size * 2.4, Math.max(s.maxR * 7, totalH * 3.2) * 0.85) : size * 2.4;
  camera.position.set(dist * 0.62, -dist * 0.78, cz + dist * 0.3);
  camera.near = Math.max(0.5, size / 200); camera.far = size * 60;
  camera.updateProjectionMatrix();
  controls.update();
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

/* =====================================================================
   Aktualisieren
   ===================================================================== */
const busy = document.getElementById('busy');
let timer = null;
function rebuild() {
  clearTimeout(timer);
  const heavy = current && current.stats.tris > 250000;
  if (heavy) busy.classList.add('show');
  // Bei großen Modellen erst rechnen, wenn der Regler kurz stillsteht
  timer = setTimeout(() => requestAnimationFrame(doRebuild), heavy ? 180 : 0);
}

function setGeometry(mesh, data) {
  const g = new THREE.BufferGeometry();
  if (data) {
    g.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
    g.setIndex(new THREE.BufferAttribute(data.indices, 1));
    g.computeVertexNormals();
  }
  mesh.geometry.dispose();
  mesh.geometry = g;
  mesh.visible = !!data;
}

function doRebuild() {
  current = buildLampshade(P);
  setGeometry(shade, current);
  setGeometry(baseMesh, current.base);
  material.color.set(P.farbe);
  baseMaterial.color.set(P.farbe).multiplyScalar(0.82);
  applyScene();
  if (firstFrame) { frameCamera(); firstFrame = false; }
  renderStats();
  syncHash();
  document.getElementById('btnStlBase').hidden = !current.base;
  document.getElementById('btnExplode').hidden = !current.base;
  busy.classList.remove('show');
}

function renderStats() {
  const s = current.stats;
  const grams = s.volume / 1000 * 1.24;
  const rows = [
    ['Höhe', (s.H + s.baseH).toFixed(0) + ' mm' + (s.baseH ? ` (Schirm ${s.H.toFixed(0)})` : '')],
    ['Breite × Tiefe', `${s.width.toFixed(0)} × ${s.depth.toFixed(0)} mm`],
    ['Druckteile', s.baseH ? '2 (Schirm + Sockel)' : '1 (Schirm)'],
    ['Dreiecke', s.tris.toLocaleString('de-DE')],
    ['Filament (PLA)', 'ca. ' + grams.toFixed(0) + ' g'],
  ];
  document.getElementById('statsList').innerHTML = rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  document.getElementById('warnings').innerHTML = current.warnings
    .map(w => typeof w === 'string' ? `<li>${w}</li>` : `<li class="ok">${w.ok}</li>`).join('');
}

/* =====================================================================
   Bedienfeld
   ===================================================================== */
const inputs = {};
function buildControls() {
  const root = document.getElementById('controls');
  for (const g of SCHEMA) {
    const det = document.createElement('details');
    if (g.open) det.open = true;
    det.innerHTML = `<summary>${g.group}</summary><div class="group-body"></div>`;
    const body = det.querySelector('.group-body');
    for (const it of g.items) {
      const wrap = document.createElement('div');
      wrap.className = 'ctrl';
      wrap.dataset.key = it.k;
      const id = 'c_' + it.k;
      if (it.type === 'select') {
        wrap.innerHTML = `<label for="${id}">${it.l}</label><select id="${id}">${it.opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
        const el = wrap.querySelector('select');
        el.addEventListener('change', () => set(it.k, el.value));
        inputs[it.k] = { set: v => el.value = v };
      } else if (it.type === 'check') {
        wrap.innerHTML = `<label class="check"><input type="checkbox" id="${id}"> <span>${it.l}</span></label>`;
        const el = wrap.querySelector('input');
        el.addEventListener('change', () => set(it.k, el.checked));
        inputs[it.k] = { set: v => el.checked = v };
      } else if (it.type === 'color') {
        wrap.innerHTML = `<label for="${id}">${it.l}</label><input type="color" id="${id}">`;
        const el = wrap.querySelector('input');
        el.addEventListener('input', () => set(it.k, el.value));
        inputs[it.k] = { set: v => el.value = v };
      } else {
        wrap.innerHTML = `<div class="ctrl-head"><label for="${id}">${it.l}</label>
          <span class="num"><input type="number" min="${it.min}" max="${it.max}" step="${it.step}" aria-label="${it.l}">${it.u || ''}</span></div>
          <input type="range" id="${id}" min="${it.min}" max="${it.max}" step="${it.step}">`;
        const range = wrap.querySelector('input[type=range]');
        const num = wrap.querySelector('input[type=number]');
        const paint = v => range.style.setProperty('--fill', ((v - it.min) / (it.max - it.min) * 100) + '%');
        range.addEventListener('input', () => { num.value = range.value; paint(range.value); set(it.k, +range.value); });
        num.addEventListener('change', () => {
          const v = Math.min(it.max, Math.max(it.min, +num.value || it.min));
          num.value = v; range.value = v; paint(v); set(it.k, v);
        });
        inputs[it.k] = { set: v => { range.value = v; num.value = v; paint(v); } };
      }
      body.appendChild(wrap);
    }
    root.appendChild(det);
  }
}

function set(k, v) {
  P[k] = v;
  if (k === 'fassungTyp' && LOCH[v]) { P.lochD = LOCH[v]; inputs.lochD.set(P.lochD); }
  if (k === 'lochD') {
    const match = Object.entries(LOCH).find(([, d]) => d === v);
    P.fassungTyp = match ? match[0] : 'frei';
    inputs.fassungTyp.set(P.fassungTyp);
  }
  if (k === 'sockel') {
    if (v && P.fassungPos !== 'sockel') P.fassungPos = 'sockel';
    if (!v && P.fassungPos === 'sockel') P.fassungPos = 'boden';
    inputs.fassungPos.set(P.fassungPos);
  }
  // „Im Sockel“ braucht den Sockel; „Boden fest im Schirm“ ersetzt ihn
  if (k === 'fassungPos') {
    if (v === 'sockel' && !P.sockel) P.sockel = true;
    if (v === 'boden' && P.sockel) P.sockel = false;
    inputs.sockel.set(P.sockel);
  }
  updateEnabled();
  rebuild();
}

function updateEnabled() {
  const off = new Set();
  if (!P.fassung) ['fassungPos', 'fassungTyp', 'lochD', 'fassRing', 'speichen', 'speichenBreite', 'speichenHoehe', 'druckUmdrehen'].forEach(k => off.add(k));
  const floorMount = P.fassungPos === 'sockel' || P.fassungPos === 'boden';
  if (floorMount) ['speichen', 'speichenBreite', 'speichenHoehe'].forEach(k => off.add(k));
  const inBase = P.fassung && floorMount;
  if (!inBase) off.add('einsatz');
  if (!P.fassung || P.fassungPos !== 'boden') ['bodenDicke', 'kragen'].forEach(k => off.add(k));
  if (!inBase || P.einsatz !== 'fassung') ['nasen', 'kragen'].forEach(k => off.add(k));
  if (P.fassungPos === 'sockel' || (P.fassungPos === 'boden' && P.einsatz !== 'fassung')) off.add('fassRing');
  if (P.verdrehVerlauf !== 'lokal' || P.verdrehung === 0) ['verdrehMitte', 'verdrehBreite'].forEach(k => off.add(k));
  if (P.muster !== 'geflecht') off.add('webart');
  if (!inBase || P.einsatz !== 'puck') off.add('puckD');
  if (!inBase || P.einsatz !== 'panel') ['panelB', 'panelL', 'panelEcke'].forEach(k => off.add(k));
  if (!inBase || P.einsatz === 'fassung') ['einsatzTiefe', 'falz'].forEach(k => off.add(k));
  if (inBase && P.einsatz !== 'fassung') ['fassungTyp', 'lochD'].forEach(k => off.add(k));
  if (P.rillenForm !== 'kissen') off.add('prallheit');
  if (P.rillenAmp === 0) off.add('prallheit');
  if (P.muster === 'keine') ['straenge', 'drehung', 'webTiefe', 'wellenAmp', 'wellenFreq'].forEach(k => off.add(k));
  if (P.muster !== 'geflecht') off.add('webTiefe');
  if (P.wellenAmp === 0) off.add('wellenFreq');
  if (P.rillenAmp === 0) off.add('rillenAnzahl');
  if (P.querschnitt === '0') off.add('eckigkeit');
  if (P.verdrehung === 0) off.add('verdrehVerlauf');
  if (P.fassungPos !== 'oben') off.add('druckUmdrehen');
  if (!P.sockel) ['sockelHoehe', 'sockelUeberstand', 'sockelWand', 'sockelDeck', 'kabelD'].forEach(k => off.add(k));
  document.querySelectorAll('.ctrl').forEach(el => el.classList.toggle('disabled', off.has(el.dataset.key)));
}

function applyAll(obj) {
  P = { ...DEFAULTS };
  for (const it of ITEMS) {
    if (!(it.k in obj)) continue;
    let v = obj[it.k];
    if (it.type === 'check') v = v === true || v === 'true' || v === '1';
    else if (it.type === 'select') { v = String(v); if (!it.opts.some(o => o[0] === v)) continue; }
    else if (it.type !== 'color') { v = +v; if (!Number.isFinite(v)) continue; v = Math.min(it.max, Math.max(it.min, v)); }
    P[it.k] = v;
  }
  for (const it of ITEMS) inputs[it.k].set(P[it.k]);
  updateEnabled();
  rebuild();
}

function syncHash() {
  const diff = ITEMS.filter(it => P[it.k] !== it.def).map(it => `${it.k}=${encodeURIComponent(P[it.k])}`);
  history.replaceState(null, '', diff.length ? '#' + diff.join('&') : location.pathname);
}

function readHash() {
  if (!location.hash) return null;
  return Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
}

function randomize() {
  const r = (a, b, step = 1) => Math.round((a + Math.random() * (b - a)) / step) * step;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const H = r(120, 260);
  const rB = r(40, 110), rT = r(35, 110);
  const fine = Math.random() < 0.4;
  const obj = {
    hoehe: H, radiusUnten: rB, radiusOben: rT, bauch: r(-Math.min(rB, rT) * 0.3, 40),
    bauchPos: r(0.25, 0.75, 0.01), muster: pick(['geflecht', 'geflecht', 'geflecht', 'rechts', 'links']),
    querschnitt: pick(['0', '0', '3', '4', '4', '5', '6']), eckigkeit: r(3, 8, 0.1),
    verdrehung: Math.random() < 0.5 ? r(-60, 60) : 0, verdrehVerlauf: pick(['linear', 's', 'welle']),
    straenge: fine ? r(80, 140) : r(8, 28),
    strangBreite: fine ? r(1.3, 1.8, 0.1) : r(1.8, 4.5, 0.1),
    strangTiefe: fine ? r(1, 1.3, 0.1) : r(1.4, 2.4, 0.1),
    rillenAmp: Math.random() < 0.25 ? r(3, 8, 0.5) : 0, rillenAnzahl: r(2, 6),
    wellenAmp: !fine && Math.random() < 0.3 ? r(2, 6, 0.5) : 0, wellenFreq: r(2, 8),
    zwischenRinge: !fine && Math.random() < 0.4 ? r(1, 3) : 0,
    sockel: P.sockel, sockelHoehe: P.sockelHoehe, fassungPos: P.fassungPos, fassungTyp: P.fassungTyp,
    lochD: P.lochD, fassung: P.fassung, farbe: P.farbe,
  };
  // Drehung so wählen, dass der Überhang druckbar bleibt
  const circ = 2 * Math.PI * Math.max(rB, rT) * 1.15;
  const maxTurns = Math.tan(48 * Math.PI / 180) * H / circ - Math.abs(obj.verdrehung) / 360;
  obj.drehung = r(0.12, Math.max(0.15, maxTurns), 0.01);
  obj.webTiefe = obj.muster === 'geflecht' ? r(0, obj.strangTiefe * 0.35, 0.05) : 0;
  applyAll(obj);
}

/* ---------- Buttons ---------- */
const toast = msg => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
};

const presetBox = document.getElementById('presets');
for (const name of Object.keys(PRESETS)) {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = name;
  b.addEventListener('click', () => {
    const pr = PRESETS[name];
    applyAll({ farbe: P.farbe, ...pr });
    firstFrame = true;
  });
  presetBox.appendChild(b);
}

document.getElementById('btnRandom').onclick = randomize;
document.getElementById('btnReset').onclick = () => { applyAll(WOVEN_LIGHT); firstFrame = true; };
document.getElementById('btnCam').onclick = frameCamera;
document.getElementById('btnExplode').onclick = e => {
  exploded = !exploded;
  e.target.textContent = exploded ? 'Zusammen' : 'Zerlegt';
  applyScene(); frameCamera();
};
document.getElementById('btnLight').onclick = e => {
  night = !night;
  e.target.textContent = night ? 'Licht aus' : 'Licht an';
  applyScene(); frameCamera();
};
const fileBase = () => `${P.querschnitt === '0' ? 'rund' : P.querschnitt + 'eck'}_${P.hoehe}mm`;
document.getElementById('btnStl').onclick = () => {
  const flip = P.fassung && P.fassungPos === 'oben' && P.druckUmdrehen;
  const name = `lampenschirm_${fileBase()}.stl`;
  download(toSTL(current.positions, current.indices, flip, current.stats.H), name, 'model/stl');
  toast('STL gespeichert: ' + name);
};
document.getElementById('btnStlBase').onclick = () => {
  if (!current.base) return;
  // Sockel steht kopfüber auf dem Deckel, so braucht er keine Stützen
  const name = `sockel_${fileBase()}.stl`;
  download(toSTL(current.base.positions, current.base.indices, true, current.base.height), name, 'model/stl');
  toast('STL gespeichert: ' + name);
};
document.getElementById('btnSave').onclick = () => {
  download(JSON.stringify(P, null, 2), 'lampenschirm_parameter.json', 'application/json');
};
const fileLoad = document.getElementById('fileLoad');
document.getElementById('btnLoad').onclick = () => fileLoad.click();
fileLoad.onchange = async () => {
  const f = fileLoad.files[0]; if (!f) return;
  try { applyAll(JSON.parse(await f.text())); firstFrame = true; toast('Parameter geladen'); }
  catch { toast('Datei konnte nicht gelesen werden'); }
  fileLoad.value = '';
};
document.getElementById('btnLink').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); toast('Link mit allen Einstellungen kopiert'); }
  catch { toast('Kopieren nicht möglich. Bitte die Adresszeile kopieren.'); }
};

/* ---------- Start ---------- */
buildControls();
resize();
applyAll(readHash() || WOVEN_LIGHT);
</script>
</body>
